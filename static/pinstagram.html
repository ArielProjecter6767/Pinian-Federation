<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinstagram · Pin Browser</title>
<style>
:root{color-scheme:light;--pink:#d62976;--orange:#fa7e1e;--purple:#962fbf;--ink:#202124;--muted:#737780;--line:#ececf0;--bg:#fafafa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650;background:#efeff4;color:var(--ink)}button.primary{color:white;background:linear-gradient(115deg,var(--purple),var(--pink),var(--orange))}button.link{background:transparent;color:#2869d8;padding:5px}button:disabled{opacity:.5;cursor:wait}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100% - 980px)/2));gap:16px}.brand{font-size:25px;font-weight:900;letter-spacing:-1.5px;background:linear-gradient(110deg,var(--purple),var(--pink),var(--orange));color:transparent;background-clip:text}.top-right{display:flex;align-items:center;gap:8px}.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#f0d6e5;display:inline-flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0}.wrap{max-width:980px;margin:26px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,620px) 280px;gap:32px}.stories{display:flex;gap:16px;overflow:auto;background:#fff;border:1px solid var(--line);padding:16px;border-radius:14px;margin-bottom:20px}.story{min-width:64px;text-align:center;font-size:12px;overflow:hidden}.story .avatar{width:58px;height:58px;margin:0 auto 6px;border:2px solid var(--pink)}.card{background:white;border:1px solid var(--line);border-radius:14px;margin-bottom:22px;overflow:hidden}.posthead{display:flex;align-items:center;gap:10px;padding:12px 14px}.posthead .author{font-weight:750;flex:1}.sub{color:var(--muted);font-size:12px}.postimg{display:block;width:100%;max-height:680px;object-fit:contain;background:#f3f3f6}.actions{display:flex;align-items:center;gap:8px;padding:12px 14px 0}.heart{font-size:23px;padding:2px 5px;background:transparent}.heart.on{color:#e1306c}.postbody{padding:4px 14px 14px}.caption{margin:4px 0 8px;overflow-wrap:anywhere}.comments{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}.comment{margin:5px 0;font-size:13px;overflow-wrap:anywhere}.comment b{margin-right:6px}.commentform{display:flex;gap:8px;margin-top:10px}.commentform input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line);padding:8px 0;outline:none}.commentform button{background:transparent;color:#2869d8;padding:5px}.side{position:sticky;top:90px;align-self:start}.profileline{display:flex;align-items:center;gap:12px;margin:6px 0 20px}.profileline .who{flex:1}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}.panel h3{margin:0 0 12px}.field{width:100%;border:1px solid #dedee5;border-radius:10px;padding:11px 12px;margin:6px 0 10px;outline-color:#c65baf}.field:focus{border-color:#c65baf}.muted{color:var(--muted)}.empty{text-align:center;padding:50px 20px;color:var(--muted)}.auth{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:20px}.authbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;width:min(100%,390px);text-align:center}.authbox .brand{font-size:32px;margin:5px 0 12px}.authbox p{color:var(--muted)}.filelabel{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;background:#f3edf5;border-radius:10px;cursor:pointer;font-weight:650}.filelabel input{display:none}.preview{width:100%;max-height:240px;object-fit:contain;border-radius:10px;margin:6px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#202124;color:white;padding:11px 16px;border-radius:12px;z-index:30;max-width:90vw}
@media(max-width:780px){.wrap{display:block;max-width:620px;margin:16px auto}.side{display:none}.top{padding:0 14px}.top .desktop{display:none}.stories{border-radius:10px}.card{border-radius:10px}}
</style></head><body>
<header class="top"><div class="brand">pinstagram</div><div class="top-right"><button id="newPostBtn" class="primary" hidden>＋ Пост</button><span id="topName" class="desktop muted"></span><span id="topAvatar" class="avatar">P</span><button id="logoutBtn" hidden>Выйти</button></div></header>
<div id="root"></div><div id="toast" class="toast" hidden></div>
<script>
const $=id=>document.getElementById(id);let me=null,feed=[],following=new Set(),selectedImage="";
function toast(s){const el=$("toast");el.textContent=s;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2800)}
async function api(path,opts={}){const r=await fetch(path,{credentials:"same-origin",headers:{"Content-Type":"application/json",...(opts.headers||{})},...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||"Ошибка запроса ("+r.status+")");return d}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function avatar(user,size=""){if(user&&user.avatar_data)return '<img class="avatar '+size+'" alt="" src="'+user.avatar_data+'">';return '<span class="avatar '+size+'">'+esc((user?.nickname||"?").slice(0,1).toUpperCase())+'</span>'}
function authView(){ $("root").innerHTML='<main class="auth"><section class="authbox"><div class="brand">pinstagram</div><p>Фотографии, друзья и истории — в Pin Browser.</p><form id="authForm"><input class="field" id="nickname" minlength="3" maxlength="24" pattern="[A-Za-z0-9_.]+" placeholder="Никнейм (3–24 символа)" required autocomplete="username"><label class="filelabel">＋ Выбрать аватар (необязательно)<input type="file" id="avatarFile" accept="image/*"></label><img id="avatarPreview" class="preview" hidden><p class="sub">Вход выполняется по никнейму без пароля. Никнейм не подтверждает личность.</p><button class="primary" style="width:100%;margin-top:10px">Продолжить</button></form></section></main>';
$("avatarFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>1200000){toast("Аватар должен быть меньше 1,2 МБ");e.target.value="";return}selectedImage=await readFile(f);$("avatarPreview").src=selectedImage;$("avatarPreview").hidden=false};
$("authForm").onsubmit=async e=>{e.preventDefault();const nickname=$("nickname").value.trim();try{const body={nickname,avatar_data:selectedImage||null};me=await api("/api/pinstagram/register",{method:"POST",body:JSON.stringify(body)});await startApp()}catch(err){if(/занят|существует|уже зарегистрирован/i.test(err.message)){try{me=await api("/api/pinstagram/login",{method:"POST",body:JSON.stringify({nickname})});await startApp()}catch(e2){toast(e2.message)}}else toast(err.message)}};
}
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function appShell(){ $("root").innerHTML='<div class="wrap"><main><div class="stories" id="stories"></div><div id="composerSlot"></div><div id="feed"></div></main><aside class="side"><div class="profileline">'+avatar(me)+'<div class="who"><b>'+esc(me.nickname)+'</b><div class="sub">Твой профиль</div></div><button id="sideLogout">Выйти</button></div><div class="panel"><h3>Добро пожаловать!</h3><p class="muted">Публикуй фотографии, ставь лайки, комментируй и подписывайся на авторов.</p><p class="sub">Данные сохраняются в MongoDB Федерации.</p></div></aside></div>';
$("topName").textContent="@"+me.nickname;$("topAvatar").outerHTML=avatar(me);$("newPostBtn").hidden=false;$("logoutBtn").hidden=false;
$("newPostBtn").onclick=()=>composer();$("logoutBtn").onclick=logout;$("sideLogout").onclick=logout;renderStories();loadFeed();
}
function renderStories(){const people=[me,...feed.map(p=>p.author)].filter((u,i,a)=>u&&a.findIndex(x=>x.id===u.id)===i).slice(0,12);$("stories").innerHTML=people.map(u=>'<div class="story">'+avatar(u)+'<div>'+esc(u.nickname)+'</div></div>').join("")}
function composer(){const slot=$("composerSlot");slot.innerHTML='<section class="panel"><h3>Новая публикация</h3><textarea id="caption" class="field" rows="3" maxlength="2000" placeholder="Что нового?"></textarea><label class="filelabel">＋ Добавить фотографию<input id="postFile" type="file" accept="image/*"></label><img id="postPreview" class="preview" hidden><button id="sharePost" class="primary" style="width:100%">Опубликовать</button></section>';
let image="";$("postFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>5500000){toast("Фотография должна быть меньше 5,5 МБ");e.target.value="";return}image=await readFile(f);$("postPreview").src=image;$("postPreview").hidden=false};
$("sharePost").onclick=async()=>{if(!image){toast("Выбери фотографию");return}const btn=$("sharePost");btn.disabled=true;try{await api("/api/pinstagram/posts",{method:"POST",body:JSON.stringify({caption:$("caption").value.trim(),image_data:image})});slot.innerHTML="";await loadFeed();toast("Публикация добавлена")}catch(e){toast(e.message);btn.disabled=false}};
}
function renderPost(p){const liked=p.liked_by_me;const comments=(p.comments||[]).map(c=>'<div class="comment"><b>'+esc(c.nickname)+'</b>'+esc(c.text)+'</div>').join("");const isMe=p.author.id===me.id;const followBtn=isMe?"":'<button class="link followBtn" data-id="'+esc(p.author.id)+'">'+(p.is_following_author?"Подписан":"Подписаться")+'</button>';
return '<article class="card"><div class="posthead">'+avatar(p.author)+'<div class="author">'+esc(p.author.nickname)+'<div class="sub">'+esc(p.created_at||"")+'</div></div>'+followBtn+'</div><img class="postimg" loading="lazy" alt="Фото от '+esc(p.author.nickname)+'" src="'+p.image_data+'"><div class="actions"><button class="heart '+(liked?"on":"")+'" data-like="'+esc(p.id)+'" aria-label="Нравится">'+(liked?"♥":"♡")+'</button><b>'+p.like_count+'</b><span class="muted">❤</span><span style="margin-left:auto" class="sub">'+p.comment_count+' комментариев</span></div><div class="postbody">'+(p.caption?'<div class="caption"><b>'+esc(p.author.nickname)+'</b> '+esc(p.caption)+'</div>':"")+'<div class="comments">'+comments+'</div><form class="commentform" data-comment="'+esc(p.id)+'"><input maxlength="500" placeholder="Оставить комментарий…" required><button>Отправить</button></form></div></article>'}
async function loadFeed(){try{const d=await api("/api/pinstagram/posts");feed=d.posts||[];following=new Set(d.following||[]);renderStories();$("feed").innerHTML=feed.length?feed.map(renderPost).join(""):'<section class="card empty"><h3>Пока нет публикаций</h3><p>Будь первым — нажми «＋ Пост» и поделись фотографией.</p></section>';
$("feed").querySelectorAll("[data-like]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api("/api/pinstagram/posts/"+encodeURIComponent(b.dataset.like)+"/like",{method:"POST",body:"{}"});await loadFeed()}catch(e){toast(e.message)}});
$("feed").querySelectorAll(".followBtn").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api("/api/pinstagram/follow/"+encodeURIComponent(b.dataset.id),{method:"POST",body:"{}"});await loadFeed()}catch(e){toast(e.message)}});
$("feed").querySelectorAll("[data-comment]").forEach(form=>form.onsubmit=async e=>{e.preventDefault();const input=form.querySelector("input");const button=form.querySelector("button");button.disabled=true;try{await api("/api/pinstagram/posts/"+encodeURIComponent(form.dataset.comment)+"/comments",{method:"POST",body:JSON.stringify({text:input.value.trim()})});await loadFeed()}catch(err){toast(err.message);button.disabled=false}});
}catch(e){toast(e.message)}}
async function logout(){try{await api("/api/pinstagram/logout",{method:"POST",body:"{}"})}catch{}me=null;selectedImage="";$("newPostBtn").hidden=true;$("logoutBtn").hidden=true;authView()}
async function startApp(){if(!me||!me.id){const d=await api("/api/pinstagram/me");me=d.user}if(!me){authView();return}appShell()}
(async()=>{try{const d=await api("/api/pinstagram/me");me=d.user;if(me)appShell();else authView()}catch(e){authView();toast(e.message)}})();
</script></body></html>
