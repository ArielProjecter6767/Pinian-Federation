services:
  - type: web
    name: pinian-federation
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB_NAME
        value: pinian_federation
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_SECRET
        sync: false
      - key: CESIUM_ION_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_IMAGE_MODEL
        value: '@cf/black-forest-labs/flux-1-schnell'
